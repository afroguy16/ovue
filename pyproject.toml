[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ovue"
version = "0.1.0"
description = "A provider-agnostic message channel for agent seats."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ovue = "ovue.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ovue", "ovue.*"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["ovue"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["ovue"]
