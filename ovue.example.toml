# Copy this file to ~/.config/ovue/config.toml and choose finite
# storage and retention values before the first run.

[reference]
# Exact hostnames only. Replace this example with the hosts your seats use.
allowed_hosts = ["app.notion.com"]

[server]
host = "127.0.0.1"
port = 8765
data_dir = "~/.local/share/ovue"

[storage]
# Replace each marker with a finite integer before first startup.
# Current proposals, not measured defaults: 100000 records and 268435456 bytes.
max_pointer_records = "REPLACE_WITH_FINITE_INTEGER"
max_logical_database_bytes = "REPLACE_WITH_FINITE_INTEGER"

[retention]
# Current proposals, not measured defaults: 30 and 90 days.
acknowledged_pointer_max_age_days = "REPLACE_WITH_FINITE_INTEGER"
traffic_log_max_age_days = "REPLACE_WITH_FINITE_INTEGER"

[limits]
# Current proposal: 1000. Choose a finite total at least 10 per registered seat.
max_unread_global = "REPLACE_WITH_FINITE_INTEGER"
send_per_minute = 60
invalid_per_minute = 60
max_http_workers = 160
request_timeout_seconds = 10
